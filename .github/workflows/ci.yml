name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  STATICCHECK_VERSION: "2025.1.1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            codec/go.sum
            store/sqlite/go.sum
            store/postgres/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: go vet
        run: |
          for m in . codec store/sqlite store/postgres; do
            echo "::group::go vet $m"
            (cd "$m" && go vet ./...) || exit 1
            echo "::endgroup::"
          done

      - name: staticcheck
        run: |
          for m in . codec store/sqlite store/postgres; do
            echo "::group::staticcheck $m"
            (cd "$m" && go run honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION} ./...) || exit 1
            echo "::endgroup::"
          done

  modules:
    name: Module graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The workspace hides broken requires from every other job, so check the
      # published module graph explicitly with GOWORK=off. This is what catches
      # a submodule pinned to a version nobody can fetch — the state that made
      # store/sqlite and store/postgres impossible to `go get`.
      - name: Submodule requires resolve without the workspace
        run: |
          for m in store/sqlite store/postgres; do
            echo "::group::go mod download $m"
            (cd "$m" && GOWORK=off go mod download \
              github.com/zestor-dev/zestor \
              github.com/zestor-dev/zestor/codec) || exit 1
            echo "::endgroup::"
          done

  unit:
    name: Unit (root, codec, sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            codec/go.sum
            store/sqlite/go.sum

      - name: Root module (store, gomap, storetest, examples)
        run: go test -count=1 -race ./...

      - name: Codec module
        working-directory: codec
        run: go test -count=1 -race ./...

      - name: SQLite store module
        working-directory: store/sqlite
        run: go test -count=1 -race ./...

  postgres-store:
    name: PostgreSQL store
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_CONN: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: store/postgres/go.sum

      - name: Postgres store module
        working-directory: store/postgres
        run: go test -count=1 -race ./...

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, modules, unit, postgres-store]
    if: always()
    steps:
      - name: OK
        run: |
          failed=0
          for job in "lint:${{ needs.lint.result }}" \
                     "modules:${{ needs.modules.result }}" \
                     "unit:${{ needs.unit.result }}" \
                     "postgres-store:${{ needs.postgres-store.result }}"; do
            name="${job%%:*}"; result="${job#*:}"
            echo "$name: $result"
            [[ "$result" == "success" ]] || failed=1
          done
          exit $failed
