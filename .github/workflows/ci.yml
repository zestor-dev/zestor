name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  STATICCHECK_VERSION: "2025.1.1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-go disables toolchain downloads, and the code generators in
      # tools/ need a newer Go than the modules do.
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: |
            codec/go.sum
            remote/go.sum
            store/sqlite/go.sum
            store/postgres/go.sum
            tools/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: go vet
        run: |
          for m in . codec remote remote/conformance store/sqlite store/postgres; do
            echo "::group::go vet $m"
            (cd "$m" && go vet ./...) || exit 1
            echo "::endgroup::"
          done

      - name: staticcheck
        run: |
          for m in . codec remote remote/conformance store/sqlite store/postgres; do
            echo "::group::staticcheck $m"
            (cd "$m" && go run honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION} ./...) || exit 1
            echo "::endgroup::"
          done

      - name: Generated code matches proto/
        run: |
          make proto
          if [[ -n "$(git status --porcelain -- remote/gen)" ]]; then
            echo "remote/gen is out of date. Run 'make proto' and commit the result."
            git status --short -- remote/gen
            git diff -- remote/gen
            exit 1
          fi

  modules:
    name: Standalone modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            remote/go.sum
            store/sqlite/go.sum
            store/postgres/go.sum

      # The workspace hides broken requires from every other job. Compile each
      # module with GOWORK=off, which is how a consumer builds it. go test
      # -run '^$' compiles the packages and their tests without running any,
      # so this does not need Postgres. It also fails when a require cannot
      # be downloaded.
      - name: Build submodules without the workspace
        run: |
          for m in remote store/sqlite store/postgres; do
            echo "::group::GOWORK=off $m"
            (cd "$m" && GOWORK=off go test -run '^$' ./...) || exit 1
            echo "::endgroup::"
          done

  unit:
    name: Unit (root, codec, remote, sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            codec/go.sum
            remote/go.sum
            store/sqlite/go.sum

      - name: Root module (store, gomap, storetest, examples)
        run: go test -count=1 -race ./...

      - name: Codec module
        working-directory: codec
        run: go test -count=1 -race ./...

      - name: Remote module
        working-directory: remote
        run: go test -count=1 -race ./...

      - name: SQLite store module
        working-directory: store/sqlite
        run: go test -count=1 -race ./...

  postgres-store:
    name: PostgreSQL store
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_CONN: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            remote/go.sum
            store/postgres/go.sum
            store/sqlite/go.sum

      - name: Postgres store module
        working-directory: store/postgres
        run: go test -count=1 -race ./...

      - name: Remote client against SQLite and Postgres
        working-directory: remote/conformance
        env:
          POSTGRES_REQUIRE: "1"
        run: go test -count=1 -race ./...

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, modules, unit, postgres-store]
    if: always()
    steps:
      - name: OK
        run: |
          failed=0
          for job in "lint:${{ needs.lint.result }}" \
                     "modules:${{ needs.modules.result }}" \
                     "unit:${{ needs.unit.result }}" \
                     "postgres-store:${{ needs.postgres-store.result }}"; do
            name="${job%%:*}"; result="${job#*:}"
            echo "$name: $result"
            [[ "$result" == "success" ]] || failed=1
          done
          exit $failed
