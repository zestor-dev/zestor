# Version updates. Each pull request runs the existing CI workflow.
# Security updates use this file too, once Dependabot is enabled on the repo.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /codec
      - /docs
      - /store/postgres
      - /store/sqlite
    schedule:
      interval: weekly
    # sqlite and postgres require this repo's own modules at a commit that
    # `go get` can fetch. Those pins move when we publish, not on a weekly bump.
    ignore:
      - dependency-name: github.com/zestor-dev/zestor
      - dependency-name: github.com/zestor-dev/zestor/codec
    groups:
      gomod-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Local Postgres only. CI names its own image in the workflow.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
